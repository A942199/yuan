name: GZYS Deep Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gzys-deep-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe exact manifest from browser screenshot
        shell: bash
        run: |
          set +e
          URL='https://app.wanglaoshi.xn--fiqs8s/hls/index.m3u8'
          UA='Lavf/57.83.100'
          REF='http://WJiZxLXA2.com/'
          echo '=== DNS ==='
          getent hosts app.wanglaoshi.xn--fiqs8s || true
          echo '=== WITH CURRENT PLAY HEADERS ==='
          curl -sS -L --max-time 20 -D /tmp/h1 -o /tmp/m1 -A "$UA" -e "$REF" "$URL"
          cat /tmp/h1
          echo '--- manifest ---'
          cat /tmp/m1
          echo '--- analysis ---'
          awk -F'[:,]' '/^#EXTINF:/{sum+=$2;n++} END{printf("segments=%d total_duration=%.3f\n",n,sum)}' /tmp/m1
          grep -nE '^#EXT-X-ENDLIST|^#EXT-X-STREAM-INF|^#EXT-X-DISCONTINUITY|^#EXT-X-KEY|^https?://|\.m3u8|\.ts' /tmp/m1 || true
          echo '=== NO REFERER ==='
          curl -sS -L --max-time 20 -D /tmp/h2 -o /tmp/m2 -A "$UA" "$URL"
          cat /tmp/h2
          awk -F'[:,]' '/^#EXTINF:/{sum+=$2;n++} END{printf("segments=%d total_duration=%.3f\n",n,sum)}' /tmp/m2
          sha256sum /tmp/m1 /tmp/m2 || true
          echo '=== FIRST/LAST SEGMENT ==='
          first=$(grep -v '^#' /tmp/m1 | sed '/^$/d' | head -1)
          last=$(grep -v '^#' /tmp/m1 | sed '/^$/d' | tail -1)
          base='https://app.wanglaoshi.xn--fiqs8s/hls/'
          for seg in "$first" "$last"; do
            case "$seg" in http*) S="$seg";; *) S="$base$seg";; esac
            echo "SEG=$S"
            curl -sS -L --max-time 20 -o /tmp/seg -A "$UA" -e "$REF" "$S"
            wc -c /tmp/seg
            file /tmp/seg || true
            if command -v ffprobe >/dev/null 2>&1; then ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/seg || true; fi
          done

      - name: Probe current public GZYS protocol implementation
        shell: bash
        run: |
          set +e
          rm -rf /tmp/tvbox
          git clone --depth 1 https://github.com/qist/tvbox.git /tmp/tvbox
          python -m pip install -q pycryptodome requests pyquery lxml >/dev/null 2>&1 || true
          cd /tmp/tvbox
          python - <<'PY'
          import json, sys, os, re, requests
          sys.path.insert(0, os.getcwd())
          sys.path.insert(0, os.path.join(os.getcwd(),'py'))
          try:
              from py.GZYS import Spider
              s = Spider()
              print('AUTH_READY', bool(getattr(s,'token',None)), bool(getattr(s,'token_id',None)), 'HOST', getattr(s,'host',None))
              cat = s.categoryContent('1', '1', False, {})
              items = (cat or {}).get('list') or []
              print('CATEGORY_COUNT', len(items))
              for idx,item in enumerate(items[:3]):
                  vid = item.get('vod_id','')
                  print('ITEM', idx, item.get('vod_name'), vid)
                  d = s.detailContent([vid])
                  lst = (d or {}).get('list') or []
                  if not lst:
                      print('DETAIL_EMPTY'); continue
                  v = lst[0]
                  pu = v.get('vod_play_url','')
                  print('PLAY_URL_SPEC_PREFIX', pu[:500])
                  if not pu or '$' not in pu:
                      continue
                  ep = pu.split('#')[0].split('$',1)[1]
                  p = s.playerContent('', ep, [])
                  print('PLAYER_RESULT', json.dumps(p, ensure_ascii=False)[:1500])
                  u = (p or {}).get('url') or ''
                  if not u:
                      continue
                  headers = {'User-Agent':'Lavf/57.83.100','Referer':'http://WJiZxLXA2.com/'}
                  try:
                      r = requests.get(u, headers=headers, timeout=15, allow_redirects=True)
                      txt = r.text[:10000]
                      print('MANIFEST_STATUS', r.status_code, r.headers.get('content-type'), r.url)
                      print('MANIFEST_HEAD', txt[:1200].replace('\n','\\n'))
                      if '#EXTM3U' in txt:
                          ds=[]
                          for line in txt.splitlines():
                              if line.startswith('#EXTINF:'):
                                  try: ds.append(float(line.split(':',1)[1].split(',',1)[0]))
                                  except: pass
                          print('MANIFEST_SEGMENTS', len(ds), 'DURATION', round(sum(ds),3), 'ENDLIST', '#EXT-X-ENDLIST' in txt)
                  except Exception as e:
                      print('MANIFEST_FETCH_ERR', repr(e))
          except Exception as e:
              print('PROBE_EXCEPTION', type(e).__name__, repr(e))
          PY

      - name: Cleanup probe workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gzys-deep-probe.yml
          git commit -m 'chore: remove one-shot gzys deep probe' || true
          git push || true

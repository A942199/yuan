name: Strict BD media fix

on:
  push:
    branches:
      - fix/bd-media-validation-20260913

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source fixes in workspace
        id: patch
        run: |
          python scripts/apply-bd-media-fix.py
          echo "changed=$(cat /tmp/patch_changed)" >> "$GITHUB_OUTPUT"

      - name: Syntax checks
        run: |
          node --check js/yiys.js
          node --check js/jianpian.js
          grep -q 'resolved_media_dead' js/yiys.js
          grep -q 'source_media_unavailable' js/jianpian.js
          grep -q 'https://otkxofv8.yiys08.com' js/yiys.js

      - name: Strict YiYS known-good regression
        run: node scripts/test-yiys-live.mjs

      - name: Strict YiYS dead-media rejection
        shell: bash
        run: |
          set +e
          YIYS_TEST_TITLE='千与千寻' node scripts/test-yiys-live.mjs
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'no_verified_playable_line' yiys-live-report.json
          echo STRICT_YIYS_DEAD_MEDIA_REJECTION_PASS

      - name: Strict Jianpian source runtime to first media bytes
        shell: bash
        run: |
          cat >/tmp/test-jianpian.cjs <<'NODE'
          const fs=require('fs'), vm=require('vm')
          ;(async()=>{
            const timeout=(ms=15000)=>AbortSignal.timeout(ms)
            async function rpcGet(url,opt={}){
              const res=await fetch(url,{headers:opt.headers||{},redirect:'follow',signal:timeout()})
              const data=await res.text(); const headers={}; res.headers.forEach((v,k)=>headers[k]=v)
              return {data,status:res.status,headers,respHeaders:headers}
            }
            const ctx={console,URL,URLSearchParams,setTimeout,clearTimeout,argsify:x=>typeof x==='string'?JSON.parse(x):x,jsonify:x=>JSON.stringify(x),$print:(...a)=>console.log('SOURCE_PRINT',...a),$fetch:{get:rpcGet}}
            ctx.globalThis=ctx; vm.createContext(ctx)
            vm.runInContext(fs.readFileSync('js/jianpian.js','utf8')+'\n;globalThis.__source={search,getTracks,getPlayinfo};',ctx,{filename:'jianpian.js'})
            const api=ctx.__source, title='千与千寻'
            const search=JSON.parse(await api.search(JSON.stringify({text:title,page:1})))
            const card=(search.list||[]).find(x=>String(x.vod_name||'').trim()===title)||(search.list||[])[0]
            if(!card) throw new Error('search_no_card')
            const lines=JSON.parse(await api.getTracks(JSON.stringify(card.ext||{id:card.vod_id}))).list||[]
            if(!lines.length||!lines[0].tracks?.length) throw new Error('no_tracks')
            console.log('FIRST_LINE',lines[0].title,lines[0].tracks[0].name)
            const play=JSON.parse(await api.getPlayinfo(JSON.stringify(lines[0].tracks[0].ext)))
            const url=play.urls?.[0]; if(!url) throw new Error('first_line_not_playable')
            console.log('PLAY_URL',url)
            const sourceHeaders=Object.assign({},...(Array.isArray(play.headers)?play.headers:[play.headers||{}]))
            let current=url
            for(let depth=0;depth<5;depth++){
              const headers={...sourceHeaders}; if(depth>0) headers.Range='bytes=0-65535'
              const res=await fetch(current,{headers,redirect:'follow',signal:timeout()})
              const buf=Buffer.from(await res.arrayBuffer()), text=buf.toString('utf8'), ct=res.headers.get('content-type')||''
              if(!res.ok) throw new Error('media_http_'+res.status)
              if(/^#EXTM3U/.test(text)||/mpegurl/i.test(ct)){
                const next=text.split(/\r?\n/).map(s=>s.trim()).find(s=>s&&!s.startsWith('#'))
                if(!next) throw new Error('empty_hls')
                current=new URL(next,res.url).toString(); continue
              }
              if(!buf.length) throw new Error('empty_media')
              if(depth===0 && /html|json/i.test(ct)) throw new Error('unexpected_media_type_'+ct)
              console.log('STRICT_JIANPIAN_MEDIA_PASS',res.status,ct,buf.length)
              return
            }
            throw new Error('hls_depth_exceeded')
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
          node /tmp/test-jianpian.cjs

      - name: Commit source fixes after strict tests
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/yiys.js js/jianpian.js
          git commit -m 'fix: validate BD media before returning playback'
          git push origin HEAD:fix/bd-media-validation-20260913

name: Strict BD media fix

on:
  push:
    branches:
      - fix/bd-media-validation-20260913

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic source fixes when needed
        id: patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          changed = False

          yiys = Path('js/yiys.js')
          text = yiys.read_text()
          if "resolved_media_dead" not in text:
              old = """const SITE = 'https://aleig4ah.yiys05.com'\nconst FALLBACK_SITES = [\n    SITE,\n    SITE.replace(/^https:/i, 'http:'),\n]"""
              new = """const SITE = 'https://otkxofv8.yiys08.com'\nconst FALLBACK_SITES = [\n    SITE,\n    'https://api2233.yiys06.com',\n    'https://ws4afrx6.yiys06.com',\n]"""
              if old not in text:
                  raise SystemExit('yiys host block not found')
              text = text.replace(old, new, 1)

              marker = "async function resolvePlayCandidate(candidate) {"
              helper = """async function isPlayableMediaUrl(url) {\n    const value = textOf(url).trim()\n    if (!/^https?:\\/\\//i.test(value)) return false\n    if (!/\\.m3u8(?:$|[?#])/i.test(value)) return true\n    try {\n        const resp = await $fetch.get(value, { headers: { 'User-Agent': UA } })\n        const status = Number(resp && resp.status || 200)\n        const body = textOf(resp && resp.data).replace(/^\\uFEFF/, '').trimStart()\n        return status >= 200 && status < 400 && body.startsWith('#EXTM3U')\n    } catch (_) {\n        return false\n    }\n}\n\n"""
              if marker not in text:
                  raise SystemExit('yiys resolve marker not found')
              text = text.replace(marker, helper + marker, 1)

              old = """        if (/^https?:\\/\\//i.test(playUrl)) {\n            return { ok: true, url: playUrl, reason: 'resolved' }\n        }"""
              new = """        if (/^https?:\\/\\//i.test(playUrl)) {\n            if (await isPlayableMediaUrl(playUrl)) {\n                return { ok: true, url: playUrl, reason: 'resolved' }\n            }\n            return { ok: false, reason: 'resolved_media_dead' }\n        }"""
              if old not in text:
                  raise SystemExit('yiys resolved block not found')
              text = text.replace(old, new, 1)

              old = """    if (/^https?:\\/\\//i.test(rawUrl)) {\n        return { ok: true, url: rawUrl, reason: 'raw_direct' }\n    }"""
              new = """    if (/^https?:\\/\\//i.test(rawUrl)) {\n        if (await isPlayableMediaUrl(rawUrl)) {\n            return { ok: true, url: rawUrl, reason: 'raw_direct' }\n        }\n        return { ok: false, reason: 'raw_media_dead' }\n    }"""
              if old not in text:
                  raise SystemExit('yiys raw block not found')
              text = text.replace(old, new, 1)
              yiys.write_text(text)
              changed = True

          jp = Path('js/jianpian.js')
          text = jp.read_text()
          if "source_media_unavailable" not in text:
              old = """        const priority = (source) => {\n            const label = `${source.source_key || ''} ${source.name || ''}`.toLowerCase()\n            if (label.includes('lz')) return 0\n            if (label.includes('sd')) return 1\n            if (label.includes('高清1') || label.includes('dytt')) return 2\n            if (label.includes('蓝光')) return 3\n            if (label.includes('vip')) return 4\n            return 5\n        }"""
              new = """        const priority = (source) => {\n            const key = String(source.source_key || '').toLowerCase()\n            const label = `${source.source_key || ''} ${source.name || ''}`.toLowerCase()\n            if (key === 'back_source_list_cdn' || label.includes('vip') || label.includes('极速') || label.includes('高速')) return 0\n            if (key === 'back_source_list_dszy' || label.includes('蓝光')) return 1\n            if (key === 'back_source_list_hnzy' || key === 'back_source_list_hhzy' || key === 'back_source_list_mtzy') return 2\n            if (label.includes('高清4') || label.includes('高清3')) return 3\n            if (label.includes('lz')) return 90\n            return 10\n        }"""
              if old not in text:
                  raise SystemExit('jianpian priority block not found')
              text = text.replace(old, new, 1)

              marker = "async function getPlayinfo(ext) {"
              helper = """async function isPlayableSourceUrl(url, headers) {\n    const value = String(url || '').trim()\n    if (!/^https?:\\/\\//i.test(value)) return false\n    if (!/\\.m3u8(?:$|[?#])/i.test(value)) return true\n    try {\n        const resp = await $fetch.get(value, { headers: headers })\n        const status = Number(resp && resp.status || 200)\n        const body = String(resp && resp.data || '').replace(/^\\uFEFF/, '').trimStart()\n        return status >= 200 && status < 400 && body.startsWith('#EXTM3U')\n    } catch (_) {\n        return false\n    }\n}\n\n"""
              if marker not in text:
                  raise SystemExit('jianpian playinfo marker not found')
              text = text.replace(marker, helper + marker, 1)

              old = """    if (!/^https?:\\/\\//i.test(playUrl || '')) return JSON.stringify({ urls: [] })\n    return JSON.stringify({ urls: [playUrl], headers: [header] })"""
              new = """    if (!/^https?:\\/\\//i.test(playUrl || '')) return JSON.stringify({ urls: [] })\n    if (!(await isPlayableSourceUrl(playUrl, header))) {\n        $print('source_media_unavailable', playUrl)\n        return JSON.stringify({ urls: [] })\n    }\n    return JSON.stringify({ urls: [playUrl], headers: [header] })"""
              if old not in text:
                  raise SystemExit('jianpian playinfo block not found')
              text = text.replace(old, new, 1)
              jp.write_text(text)
              changed = True

          print('PATCH_CHANGED', changed)
          with open('/tmp/patch_changed', 'w') as f:
              f.write('1' if changed else '0')
          PY
          echo "changed=$(cat /tmp/patch_changed)" >> "$GITHUB_OUTPUT"

      - name: Syntax checks
        run: |
          node --check js/yiys.js
          node --check js/jianpian.js
          grep -q "resolved_media_dead" js/yiys.js
          grep -q "source_media_unavailable" js/jianpian.js
          grep -q "https://otkxofv8.yiys08.com" js/yiys.js

      - name: Strict YiYS live regression probe
        run: node scripts/test-yiys-live.mjs

      - name: Record YiYS target state
        continue-on-error: true
        env:
          YIYS_TEST_TITLE: 千与千寻
        run: node scripts/test-yiys-live.mjs

      - name: Strict Jianpian actual-source playback test
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm')
          const timeout=(ms=15000)=>AbortSignal.timeout(ms)
          async function rpcGet(url,opt={}){
            const res=await fetch(url,{headers:opt.headers||{},redirect:'follow',signal:timeout()})
            const data=await res.text()
            const headers={}; res.headers.forEach((v,k)=>headers[k]=v)
            return {data,status:res.status,headers,respHeaders:headers}
          }
          const ctx={
            console,
            URL,
            URLSearchParams,
            setTimeout,
            clearTimeout,
            argsify:x=>typeof x==='string'?JSON.parse(x):x,
            jsonify:x=>JSON.stringify(x),
            $print:(...a)=>console.log('SOURCE_PRINT',...a),
            $fetch:{get:rpcGet},
          }
          ctx.globalThis=ctx
          vm.createContext(ctx)
          const source=fs.readFileSync('js/jianpian.js','utf8')+'\n;globalThis.__source={search,getTracks,getPlayinfo};'
          vm.runInContext(source,ctx,{filename:'jianpian.js'})
          const api=ctx.__source
          const title='千与千寻'
          const search=JSON.parse(await api.search(JSON.stringify({text:title,page:1})))
          const card=(search.list||[]).find(x=>String(x.vod_name||'').trim()===title)||(search.list||[])[0]
          if(!card) throw new Error('search_no_card')
          const tracks=JSON.parse(await api.getTracks(JSON.stringify(card.ext||{id:card.vod_id})))
          if(!tracks.list?.length||!tracks.list[0].tracks?.length) throw new Error('no_tracks')
          console.log('FIRST_LINE',tracks.list[0].title,tracks.list[0].tracks[0].name)
          const play=JSON.parse(await api.getPlayinfo(JSON.stringify(tracks.list[0].tracks[0].ext)))
          const url=play.urls?.[0]
          if(!url) throw new Error('first_line_not_playable')
          console.log('PLAY_URL',url)

          async function fetchChunk(url, range){
            const headers={}
            for(const item of (Array.isArray(play.headers)?play.headers:[play.headers||{}])) Object.assign(headers,item||{})
            if(range) headers.Range='bytes=0-65535'
            const res=await fetch(url,{headers,redirect:'follow',signal:timeout()})
            const buf=Buffer.from(await res.arrayBuffer())
            return {res,buf,text:buf.toString('utf8')}
          }
          let current=url
          for(let depth=0;depth<4;depth++){
            const r=await fetchChunk(current,false)
            const ct=r.res.headers.get('content-type')||''
            if(!r.res.ok) throw new Error('media_http_'+r.res.status)
            if(/^#EXTM3U/.test(r.text)||/mpegurl/i.test(ct)){
              const next=r.text.split(/\r?\n/).map(s=>s.trim()).find(s=>s&&!s.startsWith('#'))
              if(!next) throw new Error('empty_hls')
              current=new URL(next,r.res.url).toString()
              continue
            }
            if(r.buf.length<=0) throw new Error('empty_media')
            console.log('STRICT_JIANPIAN_MEDIA_PASS',r.res.status,ct,r.buf.length)
            process.exit(0)
          }
          const seg=await fetchChunk(current,true)
          if(!(seg.res.status===200||seg.res.status===206)||seg.buf.length<=0) throw new Error('segment_failed_'+seg.res.status)
          console.log('STRICT_JIANPIAN_MEDIA_PASS',seg.res.status,seg.res.headers.get('content-type')||'',seg.buf.length)
          NODE

      - name: Commit source fixes after strict tests
        if: steps.patch.outputs.changed == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/yiys.js js/jianpian.js
          git commit -m 'fix: validate BD media before returning playback'
          git push origin HEAD:fix/bd-media-validation-20260913

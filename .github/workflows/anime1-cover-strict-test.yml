name: Anime1 Cover Strict Test

on:
  push:
    branches: [main]
    paths:
      - 'js/anime1.js'
      - 'tools/anime1_cover_strict_test.js'
      - '.github/workflows/anime1-cover-strict-test.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: |
          mkdir -p /tmp/anime1-cover-test
          cd /tmp/anime1-cover-test
          npm init -y >/dev/null 2>&1
          npm install axios cheerio >/dev/null 2>&1

      - name: Strict Anime1 cover and playback test
        run: NODE_PATH=/tmp/anime1-cover-test/node_modules node tools/anime1_cover_strict_test.js

      - name: Remove temporary test files after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/anime1-cover-strict-test.yml tools/anime1_cover_strict_test.js
          git commit -m 'chore: remove Anime1 cover probe'
          git pull --rebase origin main
          git push origin main

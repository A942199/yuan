name: PPnix Browser Source Test V2

on:
  push:
    branches:
      - test/ppnix-browser-source
    paths:
      - '.github/workflows/ppnix-browser-source-test-v2.yml'
  workflow_dispatch:

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser source probe
        shell: bash
        run: |
          cat > /tmp/test.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          const targetUrl='https://www.ppnix.com/cn/movie/347.html';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!chrome) throw new Error('chrome_not_found');
          const port=9510+Math.floor(Math.random()*200), profile=`/tmp/pp-${Date.now()}`;
          const child=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled','--window-size=1365,900','--lang=zh-CN',`--user-data-dir=${profile}`,`--remote-debugging-port=${port}`,'about:blank'],{stdio:'ignore'});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function waitPage(){
            const end=Date.now()+30000;
            while(Date.now()<end){
              try{const r=await fetch(`http://127.0.0.1:${port}/json`);const j=await r.json();const p=j.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);if(p)return p;}catch{}
              await sleep(400);
            }
            throw new Error('cdp_target_timeout');
          }
          let ws,seq=0;const pending=new Map();
          function send(method,params={}){return new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('cdp_timeout:'+method))}},15000)})}
          async function evalJs(expression,awaitPromise=false){const m=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise});if(m?.result?.exceptionDetails)throw new Error('eval_error:'+JSON.stringify(m.result.exceptionDetails).slice(0,300));return m?.result?.result?.value}
          try{
            const page=await waitPage();ws=new WebSocket(page.webSocketDebuggerUrl);
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(!m.id||!pending.has(m.id))return;const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m)};
            await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
            await send('Runtime.enable');await send('Page.enable');
            await send('Page.navigate',{url:targetUrl});
            await sleep(4000);
            let state={},html='';const end=Date.now()+70000;
            while(Date.now()<end){
              try{state=await evalJs(`({url:location.href,title:document.title,html:document.documentElement.outerHTML})`)}catch(e){console.log('EVAL_RETRY',String(e));await sleep(1000);continue}
              html=String(state?.html||'');
              console.log('PAGE',state?.url,'TITLE',state?.title,'LEN',html.length);
              if(/m3u8\s*=\s*\[([\s\S]*?)\]/.test(html))break;
              if(String(state?.title||'').toLowerCase().includes('just a moment')||html.includes('/cdn-cgi/challenge-platform'))console.log('WAITING_CF');
              await sleep(1500);
            }
            const mm=html.match(/m3u8\s*=\s*\[([\s\S]*?)\]/);
            if(!mm)throw new Error(`m3u8_array_not_found:${state?.title||''}:${state?.url||''}`);
            const vals=[];const re=/['\"]([^'\"]+)['\"]/g;let x;while((x=re.exec(mm[1])))if(String(x[1]||'').trim())vals.push(String(x[1]).trim());
            if(!vals.length)throw new Error('m3u8_values_empty');
            console.log('M3U8_VALUES',JSON.stringify(vals));
            const id='347', attempts=[];let success=null;
            for(const v of vals){
              const u=`https://www.ppnix.com/info/m3u8/${id}/${encodeURIComponent(v)}.m3u8`;
              const r=await evalJs(`(async()=>{try{const r=await fetch(${JSON.stringify(u)},{credentials:'include',cache:'no-store'});const t=await r.text();return {url:r.url,status:r.status,ct:r.headers.get('content-type')||'',text:t.slice(0,5000)}}catch(e){return {url:${JSON.stringify(u)},status:0,error:String(e&&e.message||e),text:''}}})()`,true);
              const ok=Number(r?.status)>=200&&Number(r?.status)<300&&/^#EXTM3U/m.test(String(r?.text||'').trimStart());
              const a={value:v,source_url:u,final_url:r?.url||u,status:r?.status||0,content_type:r?.ct||'',error:r?.error||'',extm3u:ok};attempts.push(a);console.log('SOURCE_ATTEMPT',JSON.stringify(a));
              if(ok){success={...a,preview:String(r.text||'').slice(0,1000)};break}
            }
            const report={target_url:targetUrl,title:state?.title||'',values:vals,attempts,success};fs.writeFileSync('ppnix-source-report.json',JSON.stringify(report,null,2));
            if(!success)throw new Error('no_valid_m3u8_source');
            console.log('PPNIX_SOURCE_OK');console.log('SOURCE_URL='+success.source_url);console.log('FINAL_URL='+success.final_url);console.log('STATUS='+success.status);console.log('CONTENT_TYPE='+success.content_type);console.log('PLAYLIST_PREVIEW='+success.preview.replace(/\n/g,'\\n'));
          }finally{try{ws?.close()}catch{}try{child.kill('SIGKILL')}catch{}}
          NODE
          node /tmp/test.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppnix-source-report-v2
          path: ppnix-source-report.json
          if-no-files-found: ignore

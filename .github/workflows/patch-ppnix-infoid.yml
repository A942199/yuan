name: Patch PPnix infoid

on:
  push:
    paths:
      - '.github/workflows/patch-ppnix-infoid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PPnix playback id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/ppnix.js')
          s = p.read_text(encoding='utf-8')

          needle = """    const cid = html.match(/classid\\s*=\\s*(\\d+)/)\n    if (cid) isTv = cid[1] === '2'\n\n    const values = parseM3u8Values(html)\n"""
          repl = """    const cid = html.match(/classid\\s*=\\s*(\\d+)/)\n    if (cid) isTv = cid[1] === '2'\n\n    // PPnix detail-page id and playback infoid are not guaranteed to be identical.\n    // Prefer the explicit infoid emitted by the page; keep the URL id only as a\n    // compatibility fallback for older pages.\n    const infoIdMatch = html.match(/infoid\\s*=\\s*['\"]?(\\d+)/i)\n    const infoId = infoIdMatch ? infoIdMatch[1] : String(id)\n\n    const values = parseM3u8Values(html)\n"""
          if needle not in s:
              raise SystemExit('target block not found')
          s = s.replace(needle, repl, 1)

          s = s.replace(
              "const m3u8Url = `${$base_url}/info/m3u8/${id}/${encodeURIComponent(v)}.m3u8`",
              "const m3u8Url = `${$base_url}/info/m3u8/${infoId}/${encodeURIComponent(v)}.m3u8`",
              1,
          )
          s = s.replace(
              "subs[lang] = `${$base_url}/info/subtitle/${id}/${encodeURIComponent(v)}/${lang}.srt`",
              "subs[lang] = `${$base_url}/info/subtitle/${infoId}/${encodeURIComponent(v)}/${lang}.srt`",
              1,
          )
          s = s.replace(
              "        id,\n        title,\n        list: [{ title: '正片', tracks }],",
              "        id,\n        infoId,\n        title,\n        list: [{ title: '正片', tracks }],",
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check js/ppnix.js
      - name: Static playback construction test
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const s = fs.readFileSync('js/ppnix.js','utf8')
          for (const required of [
            /infoid\\s\*=\\s\*\['\"]\?\(\\d\+\)/,
            /info\/m3u8\/\$\{infoId\}/,
            /info\/subtitle\/\$\{infoId\}/,
          ]) {
            if (!required.test(s)) throw new Error('missing expected PPnix infoId logic: ' + required)
          }
          console.log('PPnix infoId construction checks passed')
          NODE
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ppnix.js
          git commit -m 'fix: use PPnix infoid for playback URLs'
          git push origin HEAD:main

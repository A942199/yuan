name: Apply GZYS Play Header Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gzys-play-header-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch GZYS playback headers
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/gzys.js')
          s = p.read_text(encoding='utf-8')
          fn_start = s.find('async function getPlayinfo')
          fn_end = s.find('async function search', fn_start)
          if fn_start < 0 or fn_end < 0:
              raise SystemExit('getPlayinfo/search function boundary not found')

          seg = s[fn_start:fn_end]
          marker = "(jsonify,{'urls':["
          if seg.count(marker) != 1:
              raise SystemExit(f'expected one play result marker, got {seg.count(marker)}')
          marker_at = seg.find(marker)
          close_at = seg.find(']});', marker_at)
          if close_at < 0:
              raise SystemExit('play result closing marker not found')

          addition = ",'headers':[{'User-Agent':'Lavf/57.83.100','Referer':'http://WJiZxLXA2.com/'}]"
          seg = seg[:close_at + 1] + addition + seg[close_at + 1:]
          s = s[:fn_start] + seg + s[fn_end:]
          p.write_text(s, encoding='utf-8')
          PY
          node --check js/gzys.js
      - name: Verify playback header patch
        run: |
          grep -F "Lavf/57.83.100" js/gzys.js
          grep -F "http://WJiZxLXA2.com/" js/gzys.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/gzys.js
          git rm .github/workflows/apply-gzys-play-header-fix.yml
          git commit -m 'fix: add required playback headers for gzys'
          git push

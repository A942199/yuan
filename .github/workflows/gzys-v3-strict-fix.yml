name: GZYS V3 Strict Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gzys-v3-strict-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply dynamic Guazi v3 authentication patch
        shell: bash
        run: |
          if grep -q '__gzys_dynamic_auth_v3__' js/gzys.js; then
            echo 'v3 override already present'
          else
            cat tools/gzys_v3_patch.js >> js/gzys.js
          fi
          node --check js/gzys.js

      - name: Install strict-test dependencies
        shell: bash
        run: |
          mkdir -p /tmp/gzys-test
          cd /tmp/gzys-test
          npm init -y >/dev/null 2>&1
          npm install axios crypto-js jsencrypt >/dev/null 2>&1

      - name: End-to-end verify cards to real HLS media
        shell: bash
        run: NODE_PATH=/tmp/gzys-test/node_modules node tools/gzys_v3_strict_test.js

      - name: Commit only after strict playback test passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gzys-v3-strict-fix.yml tools/gzys_v3_patch.js tools/gzys_v3_strict_test.js
          git add js/gzys.js
          git commit -m 'fix: use Guazi v3 dynamic auth with verified full HLS playback'
          git pull --rebase origin main
          git push origin main
